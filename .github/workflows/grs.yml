name: Update GitHub Stats

on:
  schedule:
    - cron: "0 5 * * 0" # Sunday at 05:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Prepare stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats > /dev/null; then
            git fetch origin refs/heads/stats
            git switch -c stats FETCH_HEAD
          else
            git switch --orphan stats
          fi

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=light_github
          path: stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=dark_github
          path: stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          if git rev-parse --verify HEAD > /dev/null 2>&1; then
            if ! git diff --cached --quiet; then
              old_tip=$(git rev-parse HEAD)
              git commit --amend --reset-author -m "Update stats"
              git push --force-with-lease=refs/heads/stats:$old_tip origin HEAD:refs/heads/stats
            fi
          else
            git commit -m "Update stats"
            git push origin HEAD:refs/heads/stats
          fi
